name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            software-properties-common \
            autoconf automake build-essential clang cmake fakeroot git \
            libc-ares-dev libctemplate-dev libcurl4-openssl-dev libglib2.0-dev \
            libicu-dev libsasl2-dev libsasl2-modules libsasl2-modules-gssapi-mit \
            libsecret-1-dev libssl-dev libnss3 libnss3-dev libtidy-dev libtool \
            libxext-dev libxkbfile-dev libxml2-dev libxtst-dev pkg-config rpm \
            uuid-dev xvfb

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Mailspring ${{ github.ref_name }}"
          body: |
            Custom build of Mailspring 1.22.0 with the following additions:

            **AI Assistant**
            - AI chat sidebar per email thread with citations and knowledge base search
            - Agentic skills: search mailbox, create drafts, send email (with countdown confirmation), archive/trash, web search, fetch web pages
            - Composer AI button (Rewrite, Shorter, Longer, Formal, Casual, Fix Grammar, Suggest Next Line, Draft Reply)
            - Per-turn "Use as draft reply" button under each AI response
            - Conversation history with session resume
            - Supports any OpenAI-compatible API (local models via Ollama/LM Studio, OpenAI, etc.)

            **Composer**
            - Insert and edit tables (Tab/Shift+Tab between cells, Tab from the last cell adds a row)
            - Right-click an inline image for quick size presets (Original/Large/Medium/Small)
            - Full rich-text toolbar: undo/redo, paragraph styles (Normal/Heading 1/Heading 2/Quote), text alignment, highlight color, indent/outdent, superscript/subscript, clear formatting, horizontal rule, insert inline image, and text direction (LTR/RTL)
            - Clipboard section (Cut / Copy / Paste / Paste as plain text) + Format Painter
            - Bundled open-source fonts (Roboto, Open Sans, Lato, Montserrat, Poppins, Merriweather, Lora, Source Code Pro)
            - Persistent default font face and size saved to preferences
            - Rich-text paste from Word / Google Docs preserving bold, italic, links, images
            - Pasted images (PNG/JPEG/GIF/BMP/WebP) now render inline instead of as a plain attachment
            - New Email now defaults "From" to the account of the selected thread when viewing a unified/multi-account inbox, instead of always the first account

            **UI**
            - Toolbar reorder: hamburger left, window controls right (minimize, maximize, close)
            - Subscription tab hidden from Preferences
            - Export emails/threads to Markdown with embedded images

            **Linux**
            - Fixed "could not store your password securely" error appearing even when a working secret service (GNOME Keyring/KWallet) is reachable, on launchers that don't propagate `XDG_CURRENT_DESKTOP`/`DESKTOP_SESSION` (systemd user units, some window managers, process supervisors)
          files: |
            app/dist/*.deb
            app/dist/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Cache NodeJS modules
        uses: actions/cache@v4
        with:
          path: |
            ./node_modules
            ./app/node_modules
          key: windows-2022-deps-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/package-lock.json') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          DEBUG: electron-packager

      - name: Create Windows installer
        run: node app/build/create-signed-windows-installer.js

      - name: Upload Windows installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: app/dist/MailspringSetup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
